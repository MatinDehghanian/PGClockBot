<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../app/web/static/fonts.css" />
  <link rel="stylesheet" href="../../app/web/static/panel.css" />
</head>
<body class="panel-status-body">
  <div class="panel-status" data-status="500">
    <div class="panel-status-atmosphere" aria-hidden="true">
      <span class="panel-status-orb panel-status-orb-a"></span>
      <span class="panel-status-orb panel-status-orb-b"></span>
      <span class="panel-status-grid"></span>
    </div>
    <header class="panel-status-brand">
      <img class="panel-status-logo" src="../../app/web/static/logo-64.png" alt="" width="40" height="40" />
      <div class="panel-status-brand-text">
        <strong dir="ltr">MrClockBot</strong>
        <span class="muted" dir="ltr">v9.0.1</span>
      </div>
    </header>
    <main class="panel-status-stage">
      <article class="panel-status-card">
        <div class="panel-status-card-accent" aria-hidden="true"></div>
        <p class="panel-status-watermark" dir="ltr" aria-hidden="true">500</p>
        <div class="panel-status-badge" aria-hidden="true">
          <svg class="panel-status-badge-ico" viewBox="0 0 24 24" fill="none">
            <path d="M12 8v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="12" cy="16.2" r="1" fill="currentColor"/>
            <path d="M10.2 4.8 3.6 17.1A2 2 0 0 0 5.4 20h13.2a2 2 0 0 0 1.8-2.9L13.8 4.8a2 2 0 0 0-3.6 0Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="panel-status-kicker muted" dir="ltr">HTTP 500</p>
        <h1 class="panel-status-title">خطای داخلی سرور</h1>
        <p class="panel-status-msg muted">مشکلی پیش آمد. چند لحظه دیگر دوباره تلاش کنید.</p>
        <p class="panel-status-ref" dir="ltr"><span class="muted">ref</span> e8f2eed1</p>
        <div class="panel-status-actions">
          <a class="btn" href="#">صفحه ورود</a>
          <a class="btn btn-ghost" href="#">خروج</a>
        </div>
      </article>
    </main>
    <footer class="panel-status-foot muted">اگر مشکل ادامه داشت، از حساب خارج شوید و دوباره وارد شوید.</footer>
  </div>
</body>
</html>
