<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../app/web/static/panel.css" />
  <style>
    body { margin: 0; background: var(--background); }
    .probe-mark { outline: 2px solid #ef4444; outline-offset: -2px; }
  </style>
</head>
<body>
  <div class="shell" style="display:block;height:auto;max-height:none;overflow:visible;padding:12px;">
    <div class="settings-layout can-preview" id="settings-layout">
      <div class="settings-main">
        <div class="card menu-layout-intro">
          <h2>چیدمان دکمه‌های کیبورد</h2>
          <p class="muted">متن راهنما</p>
          <div class="settings-grid menu-layout-mode">
            <label class="setting-item">
              <span>حالت چیدمان کیبورد</span>
              <select name="menu_layout_ui" id="menu_layout_ui">
                <option value="compact" selected>فشرده (جفتی — پیشنهادی)</option>
                <option value="classic">کلاسیک</option>
              </select>
            </label>
          </div>
        </div>
        <form class="menu-layout-form">
          <div class="dnd-cols">
            <div class="card dnd-card"><h2>منوی فعال</h2>
              <ul class="dnd-list"><li class="dnd-item"><div class="meta"><strong>سرویس‌های من</strong></div></li></ul>
            </div>
            <div class="card dnd-card"><h2>مخزن</h2>
              <ul class="dnd-list"><li class="dnd-item"><div class="meta"><strong>باشگاه مشتریان</strong></div></li></ul>
            </div>
          </div>
        </form>
      </div>
      <aside class="tg-preview-slot">
        <div class="card tg-preview-card">
          <h2>پیش‌نمایش تلگرام</h2>
          <div class="tg-preview-gate"><div class="actions"><button type="button" class="btn">نمایش پیش‌نمایش</button></div></div>
        </div>
      </aside>
    </div>
  </div>
  <script src="../../app/web/static/panel.js"></script>
  <script>
    // enhanceSelect runs on DOMContentLoaded in panel.js — wait then measure
    function measure() {
      const sel = document.querySelector('.ui-select-toggle');
      const lab = document.querySelector('.ui-select-label');
      const cards = [...document.querySelectorAll('.tg-preview-card, .menu-layout-intro, .dnd-card')];
      const gaps = [];
      for (let i = 0; i < cards.length - 1; i++) {
        const a = cards[i].getBoundingClientRect();
        const b = cards[i+1].getBoundingClientRect();
        gaps.push({from: cards[i].querySelector('h2')?.textContent, to: cards[i+1].querySelector('h2')?.textContent, gap: Math.round(b.top - a.bottom)});
      }
      // order in document may not be visual order — sort by top
      const vis = [...document.querySelectorAll('.tg-preview-card, .menu-layout-intro, .dnd-cols > .dnd-card')]
        .map(el => ({el, t: el.getBoundingClientRect().top, b: el.getBoundingClientRect().bottom, name: el.querySelector('h2')?.textContent}))
        .sort((a,b) => a.t - b.t);
      const vgaps = [];
      for (let i = 0; i < vis.length - 1; i++) {
        vgaps.push({from: vis[i].name, to: vis[i+1].name, gap: Math.round(vis[i+1].t - vis[i].b)});
      }
      let center = null;
      if (sel && lab) {
        const tr = sel.getBoundingClientRect();
        const lr = lab.getBoundingClientRect();
        const midT = (tr.top + tr.bottom) / 2;
        const midL = (lr.top + lr.bottom) / 2;
        center = {toggleH: tr.height, labelH: lr.height, delta: +(midL - midT).toFixed(2), labelFs: getComputedStyle(lab).fontSize, labelDisplay: getComputedStyle(lab).display, labelMb: getComputedStyle(lab).marginBottom};
      }
      document.body.dataset.probe = JSON.stringify({vgaps, center});
      console.log(document.body.dataset.probe);
    }
    setTimeout(measure, 200);
  </script>
</body>
</html>
