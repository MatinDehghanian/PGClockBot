<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="/app/web/static/panel.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar mobile-only">
      <div class="topbar-brand"><strong dir="ltr">MrClockBot</strong></div>
      <button type="button" class="menu-toggle" id="menu-toggle" aria-label="منو">
        <span class="burger" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
    </header>
    <aside class="side open" id="sidebar">
      <div class="side-panel">
        <div class="side-theme"><button type="button" class="side-theme-btn"><span class="side-theme-text">تم</span></button></div>
        <nav class="side-nav">
          <div class="nav-section"><a href="#" class="nav-item"><span>خانه</span></a></div>
        </nav>
        <div class="side-foot">
          <div class="side-foot-user">
            <span class="side-foot-name">admin</span>
            <div class="side-foot-identity"><span class="role-tag role-tag-admin">ادمین</span></div>
          </div>
          <form method="post" action="#" class="logout-form">
            <button type="submit" class="logout-link">خروج</button>
          </form>
        </div>
      </div>
    </aside>
    <div class="side-backdrop show" id="side-backdrop"></div>
    <main class="main">
      <div class="main-body page-surface">
        <div class="page-head"><h1>خانه</h1></div>
        <div class="card"><p>محتوا</p></div>
      </div>
      <footer class="site-footer">
        <div class="footer-meta"><span>© ۲۰۲۶ MrClockBot</span></div>
        <div class="footer-actions"><a class="btn btn-star" href="#">ستاره</a></div>
      </footer>
    </main>
  </div>

</html>
