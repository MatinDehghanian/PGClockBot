<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../app/web/static/panel.css" />
  <style>
    body { margin: 0; padding: 24px; background: var(--background); color: var(--foreground); font-family: Vazirmatn, sans-serif; }
    .probe { max-width: 420px; display: grid; gap: 16px; }
    .probe h1 { font-size: 1.1rem; margin: 0 0 8px; }
    .row { display: grid; gap: 8px; }
  </style>
</head>
<body>
  <div class="probe">
    <h1>تغییر مانده سرویس</h1>
    <div class="row">
      <label class="form-field">روز
        <div class="num-stepper" data-num-stepper data-step="1" data-min="-3650" data-max="3650" dir="ltr">
          <button type="button" class="num-stepper-btn" data-num-stepper-dec aria-label="کاهش">&minus;</button>
          <input class="num-stepper-input" type="text" name="extra_days" value="0" inputmode="numeric" dir="ltr" />
          <button type="button" class="num-stepper-btn" data-num-stepper-inc aria-label="افزایش">+</button>
        </div>
      </label>
      <label class="form-field">گیگ
        <div class="num-stepper" data-num-stepper data-step="1" data-min="-10000" data-max="10000" dir="ltr">
          <button type="button" class="num-stepper-btn" data-num-stepper-dec aria-label="کاهش">&minus;</button>
          <input class="num-stepper-input" type="text" name="extra_gb" value="-5" inputmode="decimal" dir="ltr" />
          <button type="button" class="num-stepper-btn" data-num-stepper-inc aria-label="افزایش">+</button>
        </div>
      </label>
    </div>
    <button class="btn btn-sm" type="button">اعمال تغییر مانده</button>
  </div>
  <script src="../../app/web/static/panel.js"></script>
</body>
</html>
