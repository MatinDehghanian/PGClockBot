<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../app/web/static/panel.css" />
  <style>
    body { margin: 0; padding: 16px; background: var(--background); }
    .demo { display: flex; flex-wrap: wrap; gap: 12px; padding: 16px; background: rgba(249,115,22,0.08); border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="table-bulk-bar demo" data-table-bulk-bar>
    <span class="table-bulk-count muted">۳ مورد</span>
    <div class="table-bulk-actions">
      <button type="button" class="btn btn-sm table-bulk-op btn-ghost"><span class="table-bulk-op-label">روشن/خاموش</span><span class="table-bulk-op-count" data-bulk-op-count>۳</span></button>
      <button type="button" class="btn btn-sm table-bulk-op btn-ok"><span class="table-bulk-op-label">تأیید</span><span class="table-bulk-op-count" data-bulk-op-count>۲</span></button>
      <button type="button" class="btn btn-sm table-bulk-op btn-warn"><span class="table-bulk-op-label">مسدود</span><span class="table-bulk-op-count" data-bulk-op-count>۱</span></button>
      <button type="button" class="btn btn-sm table-bulk-op btn-danger"><span class="table-bulk-op-label">حذف</span><span class="table-bulk-op-count" data-bulk-op-count>۴</span></button>
    </div>
  </div>
</body>
</html>
