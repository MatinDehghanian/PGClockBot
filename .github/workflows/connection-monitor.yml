name: Connection monitoring compatibility

on:
  pull_request:
    branches: [dev]
    paths:
      - 'app/services/connection_*.py'
      - 'app/services/xray_probe*.py'
      - 'app/services/pasarguard.py'
      - 'app/db/models.py'
      - 'app/jobs/**'
      - 'app/bot/**'
      - 'app/cli/connection_monitor.py'
      - 'alembic/**'
      - 'tests/test_connection_*.py'
      - 'tests/test_xray_probe.py'
      - 'tests/test_scheduler_background_jobs.py'
      - 'tests/connection_monitor_support.py'
      - 'tests/fixtures/connection_monitor_catalog.json'
      - 'requirements*.txt'
      - '.github/workflows/connection-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: monitor_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGCLOCK_CONNECTION_TEST_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/monitor_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Check scoped monitoring behavior on PostgreSQL
        run: python -m pytest tests/test_connection_*.py tests/test_xray_probe.py tests/test_scheduler_background_jobs.py -q -p no:cacheprovider

  linux-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Verify official pinned Linux archive
        env:
          CORE_ARCHIVE_SHA256: 23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
        run: |
          mkdir -p "$RUNNER_TEMP/monitor-core"
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/monitor-core/core.zip" https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip
          echo "$CORE_ARCHIVE_SHA256  $RUNNER_TEMP/monitor-core/core.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/monitor-core/core.zip" -d "$RUNNER_TEMP/monitor-core"
      - name: Validate three synthetic routes, readiness and process cleanup
        run: |
          core_digest="$(sha256sum "$RUNNER_TEMP/monitor-core/xray" | cut -d ' ' -f 1)"
          python -m app.cli.connection_monitor --binary "$RUNNER_TEMP/monitor-core/xray" --sha256 "$core_digest"
