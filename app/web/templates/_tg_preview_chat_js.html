<script>
(function(){
  const form = document.getElementById('settings-form') || document.getElementById('menu-form');
  const tab = {{ tab|tojson }};
  const values = {{ values|tojson }};
  const titleEl = document.getElementById('pv-title');
  const textEl = document.getElementById('pv-text');
  const keysEl = document.getElementById('pv-keys');
  const qrCard = document.getElementById('pv-qr');
  const qrCap = document.getElementById('pv-qr-cap');
  const qrBox = document.getElementById('pv-qr-box');
  const qrBg = document.getElementById('pv-qr-bg');
  const qrFake = document.getElementById('pv-qr-fake');
  let focusKey = null;
  let qrObjectUrl = null;
  const REMOVED_MENU = {guide:1, faq:1, restart:1, help:1};

  function val(name, fallback){
    if (!form) return (values[name] || fallback || '');
    const el = form.querySelector('[name="s_'+name+'"]');
    if (!el) return (values[name] || fallback || '');
    if (el.type === 'checkbox') return el.checked ? '1' : '0';
    if (el.type === 'file') return (values[name] || fallback || '');
    return el.value;
  }
  function qrBackgroundUrl(){
    const fileInput = form && form.querySelector('input[type="file"][name="s_qr_background"]');
    if (fileInput && fileInput.files && fileInput.files[0]) {
      if (!qrObjectUrl) qrObjectUrl = URL.createObjectURL(fileInput.files[0]);
      return qrObjectUrl;
    }
    const saved = (values.qr_background || '').trim();
    if (saved) return '/media/' + saved.replace(/^\/+/, '');
    return '';
  }
  function applyQrBackground(){
    const url = qrBackgroundUrl();
    if (qrBg) {
      if (url) {
        qrBg.src = url;
        qrBg.hidden = false;
        if (qrBox) qrBox.classList.add('has-bg');
        if (qrFake) qrFake.hidden = true;
      } else {
        qrBg.removeAttribute('src');
        qrBg.hidden = true;
        if (qrBox) qrBox.classList.remove('has-bg');
        if (qrFake) qrFake.hidden = false;
      }
    }
  }
  function esc(s){
    return String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }
  function btn(label){
    return '<button type="button" class="tg-key">'+esc(label)+'</button>';
  }
  function menuOrder(){
    const mo = document.getElementById('menu_order');
    const raw = (mo && mo.value)
      ? mo.value
      : String(values.menu_order || 'shop,services,wallet,support,referral,reseller_apply,miniapp');
    return raw.split(',').map(s => s.trim()).filter(k => k && !REMOVED_MENU[k]);
  }
  function menuLayout(){
    const sel = document.getElementById('menu_layout_select')
      || (form && form.querySelector('[name="s_menu_layout"]'))
      || document.getElementById('menu_layout')
      || document.getElementById('menu_layout_ui');
    if (sel && sel.value) return sel.value;
    return values.menu_layout || 'compact';
  }
  function fillVars(text){
    return String(text||'')
      .replaceAll('{name}','کاربر')
      .replaceAll('{order_id}','1024')
      .replaceAll('{amount}','۵۰٬۰۰۰ تومان')
      .replaceAll('{code}','CLK42')
      .replaceAll('{link}','https://t.me/example_bot?start=CLK42')
      .replaceAll('{card}','6037-****-****-1234')
      .replaceAll('{holder}','نام دارنده')
      .replaceAll('{url}','https://example.com/sub/demo');
  }
  function renderReplyKeys(labels){
    if (!keysEl) return;
    const home = val('btn_menu_home', values.btn_menu_home || '🏠 منوی اصلی');
    const compact = menuLayout() === 'compact';
    let html = '';
    if (compact) {
      for (let i=0;i<labels.length;i+=2){
        html += '<div class="tg-key-row">'+btn(labels[i])+(labels[i+1]?btn(labels[i+1]):'')+'</div>';
      }
    } else {
      html = labels.map(l => '<div class="tg-key-row">'+btn(l)+'</div>').join('');
    }
    if (home) html += '<div class="tg-key-row tg-key-home">'+btn(home)+'</div>';
    keysEl.innerHTML = html;
  }
  function render(){
    const shop = val('shop_title','کلاک بات');
    if (titleEl) titleEl.textContent = shop || 'کلاک بات';
    let text = '';
    let showQr = false;
    let showKeys = false;
    if (tab === 'welcome') {
      text = fillVars(val('welcome_text','سلام {name} 👋'));
      showKeys = true;
    } else if (tab === 'messages') {
      const map = {
        s_guide_text: 'guide_text',
        s_faq_text: 'faq_text',
        s_support_text: 'support_text',
        s_referral_text: 'referral_text',
        s_empty_services_text: 'empty_services_text',
        s_shop_empty_text: 'shop_empty_text',
        s_delivery_title: 'delivery_title',
        s_purchase_success_text: 'purchase_success_text',
        s_wallet_success_text: 'wallet_success_text',
        s_payment_reject_text: 'payment_reject_text',
      };
      const key = map[focusKey] || 'purchase_success_text';
      if (key === 'delivery_title') {
        text = fillVars(val('delivery_title','✅ سرویس آماده است')) + '\n\n' +
          fillVars(val('purchase_success_text','پرداخت تأیید شد'));
      } else {
        text = fillVars(val(key, values[key] || 'متن پیام…'));
      }
    } else if (tab === 'buttons' || tab === 'menu') {
      text = fillVars(values.welcome_text || val('welcome_text','سلام {name} 👋'));
      showKeys = true;
    } else if (tab === 'qr') {
      text = fillVars(val('purchase_success_text','سرویس فعال شد.'));
      showQr = val('qr_enabled','1') === '1';
      let cap = fillVars(val('qr_caption','QR اشتراک'));
      if (val('show_sub_link_in_text','1')==='1') {
        cap += '\n\n🔗 https://example.com/sub/demo\n📦 ۱۰ گیگ · 📅 ۳۰ روز';
      }
      if (qrCap) qrCap.textContent = cap;
      applyQrBackground();
    }
    if (showKeys) {
      const order = menuOrder();
      const map = {
        shop: values.btn_shop || 'خرید سرویس',
        services: values.btn_services || 'سرویس‌های من',
        wallet: values.btn_wallet || 'کیف پول',
        support: values.btn_support || 'پشتیبانی',
        referral: values.btn_referral || 'دعوت',
        reseller_apply: values.btn_reseller_apply || 'درخواست نمایندگی',
        miniapp: values.btn_miniapp || 'مینی‌اپ',
      };
      if (tab === 'buttons') {
        map.shop = val('btn_shop', map.shop);
        map.services = val('btn_services', map.services);
        map.wallet = val('btn_wallet', map.wallet);
        map.support = val('btn_support', map.support);
        map.referral = val('btn_referral', map.referral);
        map.reseller_apply = val('btn_reseller_apply', map.reseller_apply);
        map.miniapp = val('btn_miniapp', map.miniapp);
      }
      // miniapp is WebApp (inline only) — skip on reply keyboard preview
      const labels = order.filter(k => k !== 'miniapp').map(k => map[k]).filter(Boolean);
      renderReplyKeys(labels);
    } else if (keysEl) {
      keysEl.innerHTML = '';
    }
    if (textEl) textEl.innerHTML = esc(text).replace(/\n/g,'<br>');
    if (qrCard) qrCard.hidden = !showQr;
  }
  if (form) {
    form.addEventListener('input', render);
    form.addEventListener('change', render);
    form.addEventListener('focusin', (e) => {
      const t = e.target;
      if (t && t.name) {
        focusKey = t.name;
        render();
      }
    });
    const qrFile = form.querySelector('input[type="file"][name="s_qr_background"]');
    if (qrFile) {
      qrFile.addEventListener('change', () => {
        if (qrObjectUrl) { URL.revokeObjectURL(qrObjectUrl); qrObjectUrl = null; }
        render();
      });
    }
  }
  const mo = document.getElementById('menu_order');
  if (mo) mo.addEventListener('change', render);
  const ml = document.getElementById('menu_layout')
    || document.getElementById('menu_layout_select')
    || document.getElementById('menu_layout_ui');
  if (ml) ml.addEventListener('change', render);
  render();
  const active = document.getElementById('active-list');
  if (active && window.MutationObserver) {
    new MutationObserver(render).observe(active, {childList:true, subtree:true});
  }
})();
</script>
