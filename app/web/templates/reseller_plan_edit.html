{% extends "base.html" %}
{% block title %}ویرایش پلن نمایندگی{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>ویرایش پلن</h1>
    <p>{{ plan.name }}</p>
  </div>
  <a class="btn btn-ghost" href="/resellers/plans">بازگشت</a>
</div>

<div class="card">
  <form method="post" action="/resellers/plans/{{ plan.id }}/edit">
    <div class="form-row">
      <div>
        <label class="form-field">نام
          <input name="name" required value="{{ plan.name }}" />
        </label>
      </div>
      <div>
        <label class="form-field">قیمت (تومان)
          <input name="price" type="number" value="{{ plan.price }}" />
        </label>
      </div>
      <div>
        <label class="form-field">کمیسیون ٪
          <input name="commission_percent" type="number" value="{{ plan.commission_percent }}" />
        </label>
      </div>
      <div>
        <label class="form-field">ترتیب
          <input name="sort_order" type="number" value="{{ plan.sort_order }}" />
        </label>
      </div>
    </div>
    <label class="form-field">توضیح
      <textarea name="description" rows="2">{{ plan.description or '' }}</textarea>
    </label>
    <strong style="display:block;margin-bottom:8px;font-size:13px">دسترسی (وب = بات)</strong>
    {% for key, label in feature_perms %}
    <label class="checks"><input type="checkbox" name="perm_{{ key }}" value="1" {% if key in selected_perms %}checked{% endif %} /> {{ label }}</label>
    {% endfor %}
    <label class="checks"><input type="checkbox" name="create_pg_admin" value="1" {% if plan.create_pg_admin %}checked{% endif %} /> ساخت ادمین پاسارگارد هنگام تأیید</label>
    <label class="form-field">نقش پاسارگارد
      <select name="pg_role_id">
        <option value="">—</option>
        {% for r in pg_roles %}
        <option value="{{ r.get('id') }}" {% if plan.pg_role_id == r.get('id') %}selected{% endif %}>{{ r.get('name') or r.get('id') }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="checks"><input type="checkbox" name="is_active" value="1" {% if plan.is_active %}checked{% endif %} /> فعال</label>
    <div class="actions"><button class="btn" type="submit">ذخیره</button></div>
  </form>
</div>
{% endblock %}
