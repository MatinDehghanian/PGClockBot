{% macro shop_settings_tabs(active, tabs, base="/shop-settings") -%}
<nav class="section-tabs settings-tabs" aria-label="تب‌های تنظیمات فروشگاه">
  {% for key, label in tabs %}
  <a href="{% if key == 'security' %}/security{% else %}{{ base }}?tab={{ key }}{% endif %}" class="{% if active==key or (key=='security' and request.url.path.startswith('/security')) %}active{% endif %}">{{ label }}</a>
  {% endfor %}
</nav>
{%- endmacro %}
