<script>
(function(){
  const form = document.getElementById('appearance-form');
  if (!form) return;
  const nameEl = document.getElementById('ap-name');
  const captionEl = document.getElementById('ap-caption');
  const middleEl = document.getElementById('ap-middle');
  const photoEl = document.getElementById('ap-photo');
  const welcomeEl = document.getElementById('ap-welcome-image');
  const cmdStart = document.getElementById('ap-cmd-start');
  const cmdHelp = document.getElementById('ap-cmd-help');
  const pvName = document.getElementById('ap-pv-name');
  const pvEmptyName = document.getElementById('ap-pv-empty-name');
  const pvDesc = document.getElementById('ap-pv-desc');
  const pvShort = document.getElementById('ap-pv-short');
  const pvImg = document.getElementById('ap-pv-img');
  const pvLetter = document.getElementById('ap-pv-letter');
  const pvWelcome = document.getElementById('ap-pv-welcome');
  const pvCmdStart = document.getElementById('ap-pv-cmd-start');
  const pvCmdHelp = document.getElementById('ap-pv-cmd-help');
  let objectUrl = null;
  let welcomeObjectUrl = null;

  function setAvatar(src, letter){
    if (pvImg) {
      if (src) {
        pvImg.hidden = false;
        pvImg.src = src;
        if (pvLetter) pvLetter.hidden = true;
      } else {
        pvImg.hidden = true;
        pvImg.removeAttribute('src');
        if (pvLetter) {
          pvLetter.hidden = false;
          pvLetter.textContent = (letter || 'ر').slice(0, 1);
        }
      }
    }
  }

  function setWelcome(src){
    if (!pvWelcome) return;
    if (src) {
      pvWelcome.hidden = false;
      pvWelcome.src = src;
    } else {
      pvWelcome.hidden = true;
      pvWelcome.removeAttribute('src');
    }
  }

  function render(){
    const name = (nameEl && nameEl.value) || 'نام ربات';
    if (pvName) pvName.textContent = name;
    if (pvEmptyName) pvEmptyName.textContent = name;
    if (pvDesc) pvDesc.textContent = (captionEl && captionEl.value) || 'کپشن / درباره ربات…';
    if (pvShort) pvShort.textContent = (middleEl && middleEl.value) || 'متن وسط صفحه…';
    if (pvCmdStart) pvCmdStart.textContent = (cmdStart && cmdStart.value) || '/start';
    if (pvCmdHelp) pvCmdHelp.textContent = (cmdHelp && cmdHelp.value) || '/help';
    if (objectUrl) {
      setAvatar(objectUrl, name);
    } else if (pvImg && pvImg.getAttribute('src') && !pvImg.hidden) {
      /* keep current */
    } else {
      setAvatar('', name);
    }
    if (welcomeObjectUrl) {
      setWelcome(welcomeObjectUrl);
    } else if (pvWelcome && pvWelcome.getAttribute('src') && !pvWelcome.hidden) {
      /* keep current */
    }
  }

  form.addEventListener('input', render);
  form.addEventListener('change', render);
  if (photoEl) {
    photoEl.addEventListener('change', () => {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = null;
      const f = photoEl.files && photoEl.files[0];
      if (f) objectUrl = URL.createObjectURL(f);
      render();
    });
  }
  if (welcomeEl) {
    welcomeEl.addEventListener('change', () => {
      if (welcomeObjectUrl) URL.revokeObjectURL(welcomeObjectUrl);
      welcomeObjectUrl = null;
      const f = welcomeEl.files && welcomeEl.files[0];
      if (f) welcomeObjectUrl = URL.createObjectURL(f);
      render();
    });
  }
  render();
})();
</script>
