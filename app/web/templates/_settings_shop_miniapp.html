{# Platform switch for resellers' own Mini Apps; posts with the menu form it sits beside. #}
<div class="setting-item full">
  <label class="toggle-row ui-switch-row">
    <span class="ui-switch-copy">
      <strong>مینی‌اپ برای فروشگاه نمایندگان</strong>
      <small class="muted">روشن = نماینده‌هایی که دسترسی «مینی‌اپ فروشگاه برای مشتریان» در بسته‌شان هست، می‌توانند از تنظیمات ربات خودشان مینی‌اپ فروشگاهشان را روشن کنند. مشتری هر فروشگاه فقط اطلاعات همان فروشگاه را می‌بیند. خاموش کردن، مینی‌اپ همهٔ فروشگاه‌ها را فوراً می‌بندد.</small>
    </span>
    <span class="ui-switch">
      <input type="checkbox" name="miniapp_shops_enabled" value="1" form="menu-form" {% if values.get('miniapp_shops_enabled', '0') in ['1','true','yes','on'] %}checked{% endif %} />
      <span class="ui-switch-track" aria-hidden="true"></span>
    </span>
  </label>
</div>
