{# Progressive widget fill — shell already passed server authz.
   Body URL re-runs the same Depends authz; shell permission does not grant body.
   redirect:manual avoids injecting login HTML into #home-dash / #pg-dash. #}
{% set body_url = widgets_body_url or '/home/body' %}
<noscript>
  <div class="flash warn home-update-banner">
    <div class="home-update-copy">
      <strong>جاوااسکریپت خاموش است</strong>
      <span class="muted">برای آمار کامل، نسخهٔ یک‌مرحله‌ای را باز کنید.</span>
    </div>
    <a class="btn btn-sm btn-ghost" href="?full=1">نمایش کامل</a>
  </div>
</noscript>
<script>
(function () {
  var root = document.getElementById('home-dash') || document.getElementById('pg-dash');
  if (!root) return;
  var url = {{ body_url|tojson }};
  fetch(url, {
    credentials: 'same-origin',
    redirect: 'manual',
    headers: {
      'Accept': 'text/html',
      'X-Requested-With': 'XMLHttpRequest'
    }
  }).then(function (r) {
    if (r.type === 'opaqueredirect' || r.status === 301 || r.status === 302 || r.status === 303) {
      window.location.href = '/login';
      return null;
    }
    if (r.status === 401 || r.status === 403) {
      window.location.href = '/login';
      return null;
    }
    if (!r.ok) throw new Error('widgets body ' + r.status);
    return r.text();
  }).then(function (html) {
    if (!html) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = String(html).trim();
    var next = tmp.firstElementChild;
    if (next && root.parentNode) {
      root.parentNode.replaceChild(next, root);
      document.dispatchEvent(new CustomEvent('panel-widgets-ready', {
        detail: { id: next.id || '' }
      }));
    }
  }).catch(function () {
    /* Keep unchecked shell — never invent disconnected state. */
  });
})();
</script>
