{# Centered shell-first loading — design tokens only; no purple/glow/emoji. #}
{% set loading_title = loading_title or 'در حال بارگذاری' %}
{% set loading_cap = loading_cap or '' %}
<div class="panel-widgets-loading" role="status" aria-live="polite">
  <div class="panel-widgets-loading-inner">
    <span class="panel-widgets-loading-mark" aria-hidden="true">
      <span class="panel-widgets-loading-ring"></span>
    </span>
    <p class="panel-widgets-loading-title">{{ loading_title }}</p>
    {% if loading_cap %}
    <p class="panel-widgets-loading-cap muted">{{ loading_cap }}</p>
    {% endif %}
  </div>
</div>
