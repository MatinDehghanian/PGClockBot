{% extends "base.html" %}
{% block auth %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="logo-row">
      <img src="/static/logo.svg" alt="" />
      <div>
        <h1>ورود به پنل</h1>
        <p class="lead">مدیریت فروش کلاک بات</p>
      </div>
    </div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login" autocomplete="on">
      <label>نام کاربری
        <input name="username" value="{{ hint_user or 'admin' }}" required autocomplete="username" autofocus />
      </label>
      <label>رمز عبور
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <div class="actions" style="margin-top:16px">
        <button class="btn" type="submit" style="width:100%">ورود</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
