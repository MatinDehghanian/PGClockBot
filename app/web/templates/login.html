{% extends "base.html" %}
{% block auth %}
<div class="auth-wrap">
  <div class="auth-box">
    <h1>Sign in</h1>
    <p class="lead">PGClockBot admin panel</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login" autocomplete="on">
      <label>Username
        <input name="username" value="{{ hint_user or 'admin' }}" required autocomplete="username" autofocus />
      </label>
      <label>Password
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <p style="margin-top:1.1rem">
        <button class="btn" type="submit" style="width:100%">Continue</button>
      </p>
    </form>
    <p class="lead" style="margin-top:1.25rem;font-size:12px">
      Reset on server:<br/>
      <code>python scripts/set_web_password.py</code>
    </p>
  </div>
</div>
{% endblock %}
