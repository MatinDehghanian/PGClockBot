{% extends "base.html" %}
{% block auth %}
<div class="auth-wrap">
  <div class="auth-box">
    <h1>ورود به پنل</h1>
    <p class="lead">مدیریت فروش PGClockBot</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login" autocomplete="on">
      <label>نام کاربری
        <input name="username" value="{{ hint_user or 'admin' }}" required autocomplete="username" autofocus />
      </label>
      <label>رمز عبور
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <button class="btn" type="submit">ورود</button>
    </form>
    <p class="lead" style="margin-top:18px;font-size:12px">
      اگر رمز را فراموش کردید روی سرور بزنید:<br/>
      <code>python scripts/set_web_password.py</code>
    </p>
  </div>
</div>
{% endblock %}
