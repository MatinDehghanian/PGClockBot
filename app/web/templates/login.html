{% extends "base.html" %}
{% block title %}ورود{% endblock %}
{% block auth %}
<div class="auth-wrap">
  <div class="auth-panel">
    <div class="auth-brand">
      <img src="/static/logo.svg" alt="" />
      <h1>کلاک بات</h1>
      <p>ورود به پنل مدیریت فروش و پاسارگارد</p>
    </div>
    <form class="auth-form" method="post" action="/login" autocomplete="on">
      {% if error %}<div class="error" style="margin:0">{{ error }}</div>{% endif %}
    {% if flash_ok %}<div class="flash ok" style="margin:0">{{ flash_ok }}</div>{% endif %}
      <label>نام کاربری
        <input name="username" value="{{ hint_user or 'admin' }}" required autocomplete="username" autofocus inputmode="text" />
      </label>
      <label>رمز عبور
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <button class="btn" type="submit">ورود به پنل</button>
    </form>
    <div class="auth-foot">© ۲۰۲۶ کلاک بات</div>
  </div>
</div>
{% endblock %}
