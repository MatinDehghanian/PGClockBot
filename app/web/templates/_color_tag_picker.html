{# Fixed staff color-tag palette. Expects: selected_color, field_name (default color_tag) #}
{% set field_name = field_name or 'color_tag' %}
{% set selected_color = selected_color or '' %}
{% set color_tags = color_tags or [] %}
<div class="color-tag-picker" role="radiogroup" aria-label="تگ رنگی">
  <label class="color-tag-option{% if not selected_color %} is-selected{% endif %}">
    <input type="radio" name="{{ field_name }}" value=""
           {% if not selected_color %}checked{% endif %} />
    <span class="color-tag-swatch color-tag-swatch--none" aria-hidden="true"></span>
    <span class="color-tag-label">بدون تگ</span>
  </label>
  {% for t in color_tags %}
  <label class="color-tag-option{% if selected_color == t.key %} is-selected{% endif %}">
    <input type="radio" name="{{ field_name }}" value="{{ t.key }}"
           {% if selected_color == t.key %}checked{% endif %} />
    <span class="color-tag-swatch" style="--tag-color: {{ t.hex }}" title="{{ t.title_fa }}" aria-hidden="true"></span>
    <span class="color-tag-label">{{ t.title_fa }}</span>
  </label>
  {% endfor %}
</div>
