{# Telegram chat + Reply Keyboard live preview (shared by admin + reseller settings). #}
<aside class="tg-preview-wrap" aria-label="پیش‌نمایش تلگرام">
  <div class="tg-preview">
    <div class="tg-top">
      <div class="tg-avatar">ک</div>
      <div>
        <strong id="pv-title">{{ values.get('shop_title','کلاک بات') }}</strong>
        <small>ربات · آنلاین</small>
      </div>
    </div>
    <div class="tg-chat" id="pv-chat">
      <div class="tg-bubble bot" id="pv-bubble">
        <div id="pv-text">پیش‌نمایش پیام…</div>
      </div>
      <div class="tg-qr-card" id="pv-qr" hidden>
        <div class="tg-qr-box" id="pv-qr-box">
          <img class="tg-qr-bg" id="pv-qr-bg" alt="" hidden />
          <span class="tg-qr-fake" id="pv-qr-fake">QR</span>
        </div>
        <div class="tg-qr-cap" id="pv-qr-cap"></div>
      </div>
    </div>
    <div class="tg-reply-kb" id="pv-keys" aria-label="کیبورد پایین تلگرام"></div>
    <div class="tg-composer">
      <span class="tg-composer-ph">پیام…</span>
    </div>
  </div>
  <p class="muted tg-preview-hint">پیش‌نمایش زنده کیبورد پایین (Reply Keyboard) — با تغییر فیلدها به‌روز می‌شود.</p>
</aside>
