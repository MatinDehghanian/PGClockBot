<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}PGClock{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/panel.css" />
</head>
<body>
  {% if staff is defined and staff %}
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <span class="brand-mark">PG</span>
        <div>
          <strong>Clock Panel</strong>
          <small>{{ staff.username }} · {{ staff.role }}</small>
        </div>
      </div>
      <nav>
        <a href="/dashboard">داشبورد</a>
        <a href="/orders">سفارش‌ها</a>
        <a href="/payments">پرداخت‌ها</a>
        <a href="/tickets">تیکت‌ها</a>
        {% if staff.role == 'admin' %}
        <a href="/plans">پلن‌ها</a>
        <a href="/users">کاربران</a>
        <a href="/resellers">نمایندگان</a>
        <a href="/settings">تنظیمات</a>
        {% endif %}
        <a href="/logout" class="danger">خروج</a>
      </nav>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% else %}
    {% block auth %}{% endblock %}
  {% endif %}
</body>
</html>
